kind: mini
read_first:
  - path: .agent/manager-minis.md
    note: mini POV + mini done protocol
files:
  - .agent/manager-secretary.md
  - .agent/permissions.md
  - .agent/conventions.md
  - .agent/local-dev.md
  - projects_waygraph/zsign-all/docs/inventory.md
  - projects_waygraph/zsign-all/docs/waygraph-read-first.md
  - seat-mesh/packages/daemon/src/mesh-inbox-server.ts
  - AGENTS.md
vars:
  job_role: "{{jobRole}}"
policies:
  - id: you_are_mini
    text: You ARE mini-N — EDIT FILES; never refuse mesh work
  - id: checkback
    cmd: ./sm.sh checkback start 5m --renew 3m --expect "topic" --here
  - id: mini_done
    cmd: "./sm.sh mini done <N> PASS|FAIL: <evidence>"
  - id: chatroom
    text: Global chat default — ./sm.sh room tail (global); ./sm.sh room say "FYI:..." or CLAIMED/DONE. Named contracts use --room <slug>. Manager/secretary use room broadcast. Machine lines only; checkback arms by default.
  - id: must_not
    text: no prompt/switch/remind/night from mini; no worker ports 30N0/30N1

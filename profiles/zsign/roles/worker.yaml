kind: worker
read_first:
  - path: .agent/agent-seats.md
    note: seat POV + worker gates checklist
files:
  - .agent/workflow.md
  - .agent/permissions.md
  - .agent/conventions.md
  - .agent/local-dev.md
  - .agent/staging-access.md
  - .agent/mcp.md
  - AGENTS.md
policies:
  - id: worker_gates
    text: prove+notify.sh; to-master; clean commits; one hub
  - id: no_local_in_gitlab
    text: no ports/dc.sh/slots in MR/issue text
  - id: chatroom
    text: Global chat default — ./sm.sh room tail at turn start; ./sm.sh room say "CLAIMED:/DONE:/FYI:" (machine lines). Named contracts --room <slug>. No human POV to peers.

kind: secretary
read_first:
  - path: .agent/manager-secretary.md
    note: secretary charter
files:
  - .agent/manager-minis.md
  - .agent/agent-seats.md
  - .agent/manager-agent.md
  - .agent/permissions.md
  - .agent/conventions.md
  - scripts/inbox-server.mjs
  - tasks/agent-seats/manager/CHECKBACK.jsonl
  - tasks/agent-seats/manager/minis.json
  - AGENTS.md
policies:
  - id: mesh_watch
    cmd: ./tmux-zsign.sh secretary mesh-watch on|off|status
  - id: mini_health
    cmd: ./tmux-zsign.sh mini health
  - id: must_not
    text: no worker prompt/switch/merge/night; no rubber-stamp product MINI-DONE
  - id: chatroom
    text: Global chat — ./sm.sh room broadcast or room say (unrestricted). Poll ./sm.sh room tail for mesh status instead of eight pane scrollbacks.

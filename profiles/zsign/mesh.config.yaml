name: zsign
workspace: ../../..   # zsign workspace root (profiles/zsign -> seat-mesh -> zsign)

layout:
  nvim:
    window: nvim
  base:
    window: base
    columns: [manager, secretary]
  workers:
    window: workers
    grid: 3x2
    slots: 6
  minis:
    window: minis
    grid: 4x2
    max: 8
    leads:
      top: 1
      bottom: 2

session:
  name: dev
  workerCount: 6
  miniMax: 8

orchestrator:
  redisUrl: redis://127.0.0.1:6379
  drain:
    maxInjectPerTick: 1
    digestCooldownMs: 5000
    idleSettleMs: 5000

providers:
  - cursor-agent
  - kiro
  - claude
  - opencode
  - empty

seats:
  root: tasks/agent-seats
  templates: [FOCUS, TASKS, REMINDER]
  # Unified slot ids: manager, secretary, worker-1..6, mini-1..8
  dirs:
    manager: manager
    secretary: secretary   # create when migrating; same trio as workers
    worker: "slot-{n}"     # worker-3 -> tasks/agent-seats/slot-3/
    mini: minis.json       # pane map + job_role in minis.json

state:
  agentsJson: tmux-main-agents.json

daemon:
  port: 3099
  pollMs: 4000
  idleSettleSec: 5
  managerPromptPrefix: "[agent-manager-kiro-cursor-claude]"

ports:
  worker: "30{n}0/30{n}1"

roles:
  dir: roles

chatRooms:
  root: tasks/chat-rooms
  globalSlug: global
  checkback:
    duration: 5m
    renew: 3m

chatFiles:
  root: tasks/chat-files
  filename: CHAT.jsonl

stack:
  command: ./dc.sh
  summary: zsign compose + feature worktrees (bash driver; sm stack is passthrough)

connectivity:
  enabled: true
  proxyPort: 18887
  drivers:
    cpe:
      host: 192.168.100.1
      rebootPath: /api/system/fun
  policy:
    rebootWifiBounce: false
    smartRestart: false
    rotateMaxAttempts: 3
    cooldownMs: 1800000
